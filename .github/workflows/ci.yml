name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # COM and pywin32 are Windows-only; AutoCAD is not on the runner, so live tests are skipped.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Offline tests
        run: python -m pytest -m "not live"
