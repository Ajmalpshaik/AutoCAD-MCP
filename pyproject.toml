[project]
name = "autocad-mcp"
version = "1.5.0"
description = "MCP server connecting Claude to a running AutoCAD via COM automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["autocad", "mcp", "claude", "cad", "automation", "com"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "mcp>=2.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
autocad-mcp = "autocad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires a running AutoCAD instance (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 88
src = ["src"]
# archive/ holds stopped experiments, not the server; see docs/DECISIONS.md D-06
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
